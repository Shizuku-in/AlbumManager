name: Desktop

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            rust-target: app/build/windows/x64/plugins/rust_lib_album_manager/cargokit_build
          - os: macos-latest
            platform: macos
            rust-target: app/build/macos/Build/Intermediates.noindex/Pods.build/Release/rust_lib_album_manager.build
          - os: ubuntu-24.04
            platform: linux
            rust-target: app/build/linux/x64/release/plugins/rust_lib_album_manager/cargokit_build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Cache Cargo and Cargokit compilation
        uses: Swatinem/rust-cache@v2
        with:
          # Share across workflows on the same runner image/toolchain.
          shared-key: desktop-${{ matrix.os }}-${{ runner.arch }}-flutter-3.47.6-${{ hashFiles('app/rust_builder/cargokit/**') }}
          env-vars: ImageOS ImageVersion
          # Cargokit passes --target-dir explicitly; caching ./target alone
          # only accelerates cargo test, not the Flutter Rust bridge build.
          workspaces: |
            . -> target
            . -> ${{ matrix.rust-target }}
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfontconfig1-dev libfreetype6-dev xdg-utils
      - name: Install CocoaPods
        if: runner.os == 'macOS'
        run: brew list cocoapods || brew install cocoapods
      - run: cargo test --workspace --locked
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter build ${{ matrix.platform }} --release
        working-directory: app
