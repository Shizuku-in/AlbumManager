name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version tag
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.1' >&2
            exit 1
          fi
          version="${TAG#v}"
          echo "version=${version%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            package: windows-x64
            rust-target: app/build/windows/x64/plugins/rust_lib_album_manager/cargokit_build
          - os: macos-15
            platform: macos
            package: macos-universal
            rust-target: app/build/macos/Build/Intermediates.noindex/Pods.build/Release/rust_lib_album_manager.build
          - os: ubuntu-24.04
            platform: linux
            package: linux-x64
            rust-target: app/build/linux/x64/release/plugins/rust_lib_album_manager/cargokit_build
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Cache Cargo and Cargokit compilation
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}-${{ runner.arch }}-flutter-3.47.6-${{ hashFiles('app/rust_builder/cargokit/**') }}
          env-vars: ImageOS ImageVersion
          workspaces: |
            . -> target
            . -> ${{ matrix.rust-target }}
          cache-bin: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libfontconfig1-dev libfreetype6-dev xdg-utils
      - name: Prepare macOS universal build
        if: runner.os == 'macOS'
        run: |
          brew list cocoapods || brew install cocoapods
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          flutter config --no-enable-macos-arm64-only
      - run: cargo test --workspace --locked
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - name: Build release
        shell: bash
        working-directory: app
        run: flutter build ${{ matrix.platform }} --release --no-pub --build-name="$VERSION" --build-number="$BUILD_NUMBER"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Package Windows ZIP and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Version $env:VERSION -Tag $env:TAG
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=app/build/macos/Build/Products/Release/album_manager.app
          lipo "$bundle/Contents/MacOS/album_manager" -verify_arch arm64 x86_64
          lipo "$bundle/Contents/Frameworks/App.framework/App" -verify_arch arm64 x86_64
          mkdir -p dist staging
          ditto "$bundle" staging/album_manager.app
          cp LICENSE README.md staging/
          ditto -c -k --sequesterRsrc staging "dist/AlbumManager-$TAG-macos-universal.zip"
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle=app/build/linux/x64/release/bundle
          test -x "$bundle/album_manager"
          mkdir -p dist
          cp LICENSE README.md "$bundle/"
          tar -czf "dist/AlbumManager-$TAG-linux-x64.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify assets and write checksums
        working-directory: dist
        shell: bash
        run: |
          assets=("AlbumManager-$TAG-windows-x64.zip" "AlbumManager-$TAG-windows-x64-setup.exe" "AlbumManager-$TAG-macos-universal.zip" "AlbumManager-$TAG-linux-x64.tar.gz")
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
      - name: Publish complete release
        shell: bash
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo 'Release is already published; refusing to replace published binaries.' >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "Album Manager $TAG" --generate-notes --prerelease="$PRERELEASE"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
