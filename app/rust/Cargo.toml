[package]
name = "rust_lib_album_manager"
description = "flutter_rust_bridge layer between the Flutter app and album-core."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
album-core.workspace = true
album-formats.workspace = true
album-model.workspace = true
anyhow.workspace = true
flutter_rust_bridge = "=2.13.0"

# Installed font list (already in the dependency tree via other crates).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
